name: Get Citation Data

# 触发条件：
# 1. 可以手动触发
# 2. 当 main 分支的 Jekyll workflow 完成时触发
on:
  workflow_dispatch: # 允许手动触发
  workflow_run: # 当指定 workflow 完成后触发
    workflows: ["Build and Deploy Jekyll Site"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install Reqs
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        run: |
          cd ./google_scholar_crawler
          python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Push results to google-scholar-stats branch
        run: |
          cd ./google_scholar_crawler/results
          if [ ! -f gs_data.json ]; then
            echo "gs_data.json not produced (fetch likely failed); skip push."
            exit 0
          fi
          git init -q
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json
          git commit -q -m "Updated Citation Data"
          remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
