# =====================================================================
# Projects shown on the homepage (rendered as glass-morphism cards).
#
# How to add a new project:
#   - title : Display name (kept short — long names will be truncated).
#   - icon  : Optional emoji shown before the title.
#   - url   : Link target (usually the GitHub repo).
#   - desc  : Short description, supports `en` and `cn` for bilingual pages.
#             If `cn` is missing, the English version is used as fallback.
#   - tags  : Optional tech-stack tags shown at the bottom of the card.
# =====================================================================

- title: "LingXi-Album · 智慧相册"
  icon: "🖼️"
  url: "https://github.com/Harbour-z/LingXi-Album"
  desc:
    en: "A multi-modal AI agent for smart photo albums — upload-to-index, chat-to-find. Combines semantic, metadata and hybrid retrieval over Qdrant, with a ReAct agent driving a chat-first UX."
    cn: "一个「上传即索引、对话即找图」的多模态 AI Agent 智能相册：支持语义检索、元数据筛选与混合检索，基于 Qdrant 向量库与 ReAct Agent 实现对话式找图体验。"
  tags:
    - AI Agent
    - Multimodal

