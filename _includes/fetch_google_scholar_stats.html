<script>
    (function () {
        'use strict';
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}

        function applyStats(data) {
            if (!data) return;
            var totalEl = document.getElementById('total_cit');
            if (totalEl && data.citedby != null) {
                totalEl.innerHTML = data.citedby;
            }
            var pubs = data.publications || {};
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                if (paperId && pubs[paperId] && pubs[paperId].num_citations != null) {
                    element.innerHTML = '| Citations: ' + pubs[paperId].num_citations;
                } else {
                    element.innerHTML = '| Citations: N/A';
                }
            });
        }

        function loadStats() {
            fetch(gsDataBaseUrl + 'google-scholar-stats/gs_data.json', { cache: 'no-cache' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(applyStats)
                .catch(function (err) {
                    console.warn('[scholar-stats] fetch failed:', err);
                    var totalEl = document.getElementById('total_cit');
                    if (totalEl) totalEl.innerHTML = 'N/A';
                    var citationEles = document.getElementsByClassName('show_paper_citations');
                    Array.prototype.forEach.call(citationEles, function (el) {
                        el.innerHTML = '| Citations: N/A';
                    });
                });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStats);
        } else {
            loadStats();
        }
    })();
</script>
