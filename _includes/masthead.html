<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button>
          <div class="navicon"></div>
        </button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a
              href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
          <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <!-- Language Switch -->
      <div class="lang-switch">
        <input type="checkbox" id="lang-toggle" class="lang-toggle-checkbox">
        <label for="lang-toggle" class="lang-toggle-label">
          <span class="lang-toggle-button"></span>
          <span class="lang-text lang-en">EN</span>
          <span class="lang-text lang-cn">中文</span>
        </label>
      </div>
    </div>
  </div>
</div>
